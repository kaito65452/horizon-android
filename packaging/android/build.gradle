plugins {
    id 'com.android.application' version '8.11.1'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId providers.gradleProperty('appId').getOrElse('dev.horizon.android')
        minSdk providers.gradleProperty('minSdk').getOrElse('28').toInteger()
        targetSdk 35
        versionCode providers.gradleProperty('devVersionCode').getOrElse('30').toInteger()
        versionName '0.7.8' + (providers.gradleProperty('devVersionCode').isPresent() ? '-dev.' + providers.gradleProperty('devBuild').get() : '')
        ndk { abiFilters providers.gradleProperty('abi').get() }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.development
            versionNameSuffix '-dev.' + providers.gradleProperty('devBuild').getOrElse('local')
            if (!providers.gradleProperty('appId').isPresent()) { applicationIdSuffix '.dev' }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            signingConfig signingConfigs.development
        }
    }
    buildFeatures {
        compose true
    }
    sourceSets.main {
        java.srcDirs = ['java']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets']
        res.srcDirs = ['res']
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-graphics:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    implementation 'androidx.compose.runtime:runtime:1.7.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

layout.buildDirectory = file('../../.local/android/gradle-build')
