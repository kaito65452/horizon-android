name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target Android ABI'
        type: choice
        required: true
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - all
        default: 'arm64-v8a'
      build_type:
        description: 'Build type (--public is clean distribution APK with generated tables only)'
        type: choice
        required: true
        options:
          - public
          - dev
        default: 'public'
  push:
    branches:
      - 'build-apk*'
      - 'feat/build-apk*'
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.abi || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.abi }})
    # Guard: only run on fork, never in upstream repository (Vasysik/horizon-android)
    if: >-
      github.repository != 'Vasysik/horizon-android' &&
      (
        (github.event_name == 'push' && matrix.abi == 'arm64-v8a') ||
        github.event.inputs.abi == 'all' ||
        github.event.inputs.abi == matrix.abi ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.abi == '' || github.event.inputs.abi == null) && matrix.abi == 'arm64-v8a')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
          - abi: x86
            target: i686-linux-android
    env:
      CARGO_BUILD_JOBS: "2"
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK platform and NDK
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"

      - name: Add Rust target
        run: |
          rustup target add "${{ matrix.target }}"

      - name: Prepare engine data tables
        run: |
          python3 tools/android_prepare.py

      - name: Build Android APK
        run: |
          BUILD_FLAG="--public"
          if [ "${{ github.event.inputs.build_type }}" = "dev" ]; then
            BUILD_FLAG="--profile dev"
          fi
          python3 tools/android_build.py \
            --abi "${{ matrix.abi }}" \
            $BUILD_FLAG \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(which gradle)"

      - name: Generate Checksums
        run: |
          cd .local/android/apk/${{ matrix.abi }}
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-${{ matrix.abi }}-${{ github.event.inputs.build_type || 'public' }}
          path: |
            .local/android/apk/${{ matrix.abi }}/*.apk
            .local/android/apk/${{ matrix.abi }}/SHA256SUMS.txt
          if-no-files-found: error
